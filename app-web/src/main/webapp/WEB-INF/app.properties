#
# Configuration for the application. The name of this file comes from
# Constants.APPCODE ("app"), and so does the name of the database pool that
# is defined in it: every pool property is named "<poolid>.<property>", so
# for the pool called "app" they all start with "app.".
#
# As long as "app.driver" is missing the application creates a throwaway
# HSQLDB database for itself, so it runs without any database setup. Fill in
# and uncomment the four lines below to use a real database instead.
#
#app.driver=org.postgresql.Driver
#app.url=jdbc:postgresql://localhost:5432/domui_app
#app.userid=
#app.password=

# Only needed when the JDBC driver is not on the classpath:
#app.driverpath=/path/to/postgresql.jar

# Set this when a proxy in front of the application does not pass the
# application's own URL on correctly.
#application.url=
